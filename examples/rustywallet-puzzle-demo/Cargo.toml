[package]
name = "rustywallet-puzzle-demo"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Puzzle Solver with Xieve-like filtering"

[dependencies]
rustywallet-keys = { path = "../../crates/rustywallet-keys" }
k256 = { version = "0.13", features = ["arithmetic"] }
num_cpus = "1.16"
ctrlc = "3.4"
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
bs58 = "0.5"
num-bigint = "0.4"
num-traits = "0.2"
