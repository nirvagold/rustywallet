[package]
name = "rustywallet-bsgs-demo"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Puzzle Solver using Xieve + BSGS hybrid approach"

[dependencies]
k256 = { version = "0.13", features = ["arithmetic"] }
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
bs58 = "0.5"
num_cpus = "1.16"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
