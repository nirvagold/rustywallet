[package]
name = "rustywallet-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ECDSA message signing and verification for Bitcoin and Ethereum"
keywords = ["crypto", "wallet", "bitcoin", "ethereum", "signature"]
categories = ["cryptography", "authentication"]
readme = "README.md"

[dependencies]
rustywallet-keys = { path = "../rustywallet-keys", version = "0.1" }
secp256k1 = { version = "0.29", features = ["rand", "recovery"] }
sha2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
thiserror = "1.0"
base64 = "0.22"
ripemd = "0.1"
bs58 = "0.5"

[dev-dependencies]
proptest = "1.5"
hex = "0.4"
