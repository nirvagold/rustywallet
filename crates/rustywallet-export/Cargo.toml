[package]
name = "rustywallet-export"
version = "0.1.0"
edition = "2021"
authors = ["NirvaGold"]
description = "Export private keys to various formats (WIF, hex, JSON, CSV, BIP38, paper wallet)"
license = "MIT"
repository = "https://github.com/nirvagold/rustywallet"
documentation = "https://docs.rs/rustywallet-export"
keywords = ["bitcoin", "wallet", "export", "cryptocurrency", "bip38"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[dependencies]
# Internal crates
rustywallet-keys = { version = "0.1", path = "../rustywallet-keys" }
rustywallet-address = { version = "0.1", path = "../rustywallet-address" }

# Crypto (for BIP38)
sha2 = "0.10"
aes = "0.8"
scrypt = "0.11"

# Encoding
bs58 = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

[dev-dependencies]
rustywallet-import = { path = "../rustywallet-import" }

[features]
default = []
