[package]
name = "rustywallet-checker"
version = "0.2.0"
edition = "2021"
description = "Cryptocurrency balance checker for Bitcoin and Ethereum with Electrum backend"
license = "MIT"
repository = "https://github.com/pfrfrfr/rustywallet"
keywords = ["cryptocurrency", "bitcoin", "ethereum", "balance", "electrum"]
categories = ["cryptography", "api-bindings"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"

[dependencies.rustywallet-electrum]
path = "../rustywallet-electrum"
version = "0.3"
optional = true

[features]
default = []
electrum = ["rustywallet-electrum"]
