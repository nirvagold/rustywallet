[package]
name = "rustywallet-taproot"
version = "0.1.0"
edition = "2021"
authors = ["rustywallet contributors"]
description = "Taproot (BIP340/341/342) implementation for Bitcoin wallet development"
license = "MIT"
repository = "https://github.com/rustywallet/rustywallet"
documentation = "https://docs.rs/rustywallet-taproot"
keywords = ["bitcoin", "taproot", "schnorr", "bip340", "bip341"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[dependencies]
rustywallet-keys = { path = "../rustywallet-keys", version = "0.1" }
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
sha2 = "0.10"
bech32 = "0.11"
thiserror = "1.0"
hex = "0.4"

[dev-dependencies]
proptest = "1.4"
