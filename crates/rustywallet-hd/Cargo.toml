[package]
name = "rustywallet-hd"
version = "0.3.0"
edition = "2021"
authors = ["RustyWallet Contributors"]
description = "BIP32/BIP44/BIP85/SLIP39 Hierarchical Deterministic wallet for cryptocurrency key derivation"
license = "MIT"
repository = "https://github.com/nirvagold/rustywallet"
documentation = "https://docs.rs/rustywallet-hd"
readme = "README.md"
keywords = ["bitcoin", "bip32", "bip44", "bip85", "slip39", "hd-wallet"]
categories = ["cryptography", "authentication"]

[dependencies]
rustywallet-keys = { version = "0.1", path = "../rustywallet-keys" }
hmac = "0.12"
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
secp256k1 = { version = "0.29", features = ["rand"] }
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
getrandom = "0.2"
hex = "0.4"

[dev-dependencies]
proptest = "1.4"
rustywallet-mnemonic = { path = "../rustywallet-mnemonic" }
