[package]
name = "rustywallet-batch"
description = "High-performance batch key generation for cryptocurrency wallets"
readme = "README.md"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["crypto", "bitcoin", "batch", "wallet", "performance"]
categories = ["cryptography", "concurrency"]

[dependencies]
rustywallet-keys = { path = "../rustywallet-keys", version = "0.1" }
secp256k1.workspace = true
rand.workspace = true
thiserror.workspace = true
rayon = "1.10"
rand_chacha = "0.3"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest.workspace = true
tempfile = "3.14"
