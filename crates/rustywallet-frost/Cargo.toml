[package]
name = "rustywallet-frost"
version = "0.1.0"
edition = "2021"
authors = ["Rustywallet Contributors"]
description = "FROST threshold signatures for rustywallet"
license = "MIT"
repository = "https://github.com/rustywallet/rustywallet"
documentation = "https://docs.rs/rustywallet-frost"
keywords = ["bitcoin", "frost", "threshold", "signature", "schnorr"]
categories = ["cryptography", "authentication"]
readme = "README.md"

[dependencies]
rustywallet-keys = { path = "../rustywallet-keys", version = "0.1" }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
proptest = "1.4"
