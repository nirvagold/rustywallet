[package]
name = "rustywallet-vanity"
description = "Vanity address generator for Bitcoin and Ethereum"
readme = "README.md"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["crypto", "bitcoin", "vanity", "address", "wallet"]
categories = ["cryptography"]

[dependencies]
rustywallet-keys = { path = "../rustywallet-keys", version = "0.1" }
rustywallet-address = { path = "../rustywallet-address", version = "0.2" }
rustywallet-batch = { path = "../rustywallet-batch", version = "0.3" }
thiserror.workspace = true
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest.workspace = true
