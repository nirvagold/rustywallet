[package]
name = "rustywallet-multisig"
version = "0.2.0"
edition = "2021"
authors = ["NirvaGold"]
description = "Bitcoin multi-signature wallet utilities with PSBT integration and MuSig2 support"
license = "MIT"
repository = "https://github.com/nirvagold/rustywallet"
documentation = "https://docs.rs/rustywallet-multisig"
keywords = ["bitcoin", "multisig", "cryptocurrency", "musig", "psbt"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[dependencies]
# Internal crates
rustywallet-keys = { version = "0.1", path = "../rustywallet-keys" }
rustywallet-address = { version = "0.2", path = "../rustywallet-address" }

# Crypto
sha2 = "0.10"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }

# Encoding
bs58 = "0.5"
bech32 = "0.11"

# Error handling
thiserror = "2.0"

# Security
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
proptest = "1.0"

[features]
default = []
