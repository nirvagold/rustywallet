[package]
name = "rustywallet-tx"
version = "0.1.0"
edition = "2021"
authors = ["NirvaGold"]
description = "Bitcoin transaction building, signing, and serialization"
license = "MIT"
repository = "https://github.com/nirvagold/rustywallet"
documentation = "https://docs.rs/rustywallet-tx"
keywords = ["bitcoin", "transaction", "cryptocurrency", "signing", "segwit"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[dependencies]
# Internal crates
rustywallet-keys = { version = "0.1", path = "../rustywallet-keys" }
rustywallet-address = { version = "0.1", path = "../rustywallet-address" }

# Crypto
sha2 = "0.10"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }

# Error handling
thiserror = "2.0"

# Encoding
bs58 = "0.5"

[dev-dependencies]
proptest = "1.0"

[features]
default = []
