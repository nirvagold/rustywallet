[package]
name = "rustywallet-musig"
description = "MuSig2 Schnorr multisig implementation (BIP327)"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["bitcoin", "musig", "schnorr", "multisig", "bip327"]
categories = ["cryptography", "encoding"]

[dependencies]
rustywallet-keys = { path = "../rustywallet-keys", version = "0.1" }
rustywallet-taproot = { path = "../rustywallet-taproot", version = "0.1" }
secp256k1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
hex = "0.4"
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
