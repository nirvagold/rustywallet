[package]
name = "rustywallet-psbt"
version = "0.1.0"
edition = "2021"
authors = ["rustywallet contributors"]
description = "PSBT (BIP174/BIP370) implementation for Bitcoin wallet development"
license = "MIT"
repository = "https://github.com/rustywallet/rustywallet"
documentation = "https://docs.rs/rustywallet-psbt"
keywords = ["bitcoin", "psbt", "bip174", "wallet", "cryptocurrency"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[dependencies]
rustywallet-keys = { path = "../rustywallet-keys", version = "0.1" }
rustywallet-tx = { path = "../rustywallet-tx", version = "0.2" }
rustywallet-signer = { path = "../rustywallet-signer", version = "0.1" }
rustywallet-address = { path = "../rustywallet-address", version = "0.2" }
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
sha2 = "0.10"
ripemd = "0.1"
base64 = "0.22"
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"
proptest = "1.4"
