[workspace]
resolver = "2"
members = ["crates/*", "examples/rustywallet-checker-demo", "examples/rustywallet-generator-demo", "examples/rustywallet-batch-demo", "examples/rustywallet-vanity-demo", "examples/rustywallet-electrum-demo", "examples/rustywallet-mempool-demo", "examples/rustywallet-psbt-demo", "examples/rustywallet-bech32-demo", "examples/rustywallet-puzzle-demo", "examples/rustywallet-bsgs-demo"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/nirvagold/rustywallet"
authors = ["nirvagold <nirvagold@gmail.com>"]

[workspace.dependencies]
# Crypto
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }

# Encoding
bs58 = "0.5"
sha2 = "0.10"

# Utils
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "1.0"

# Dev dependencies
proptest = "1.5"

# Maximum performance release profile
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.release.package."*"]
opt-level = 3
